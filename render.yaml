services:
  - type: web
    name: agendapiena-ai
    runtime: node
    repo: https://github.com/Marco26-hub/receptionist
    branch: main
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: AI_DRAFTS_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: RETELL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-5-mini
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: it
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: HEALTHCHECK_MONITOR_URL
        sync: false
      - key: BACKUP_POLICY_CONFIRMED
        value: "false"
      - key: LEGAL_COMPANY_NAME
        value: Social Automation di Marco Dibenedetto
      - key: LEGAL_OWNER_NAME
        value: Marco Dibenedetto
      - key: LEGAL_VAT_NUMBER
        value: "03786790133"
      - key: LEGAL_TAX_CODE
        value: DBNMRC80E04C933Q
      - key: LEGAL_ADDRESS
        value: Via Giuseppe Verdi 2B, 22072 Cermenate (CO), Italia
      - key: LEGAL_EMAIL
        value: swsdautomation@gmail.com
      - key: LEGAL_PEC
        value: dibenedetto.80@pec.it
      - key: LEGAL_PHONE
        value: +39 347 719 6603
